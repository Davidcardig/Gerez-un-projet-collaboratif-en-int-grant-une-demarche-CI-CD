name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    name: Backend Tests & Coverage

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven

    - name: Build and test backend with Maven
      run: |
        cd back
        mvn clean install -DskipTests=false

    - name: Generate JaCoCo coverage reports
      run: |
        cd back
        mvn jacoco:report

    - name: Upload JaCoCo coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: ./back/target/site/jacoco/jacoco.xml
        flags: backend
        name: backend-coverage
        fail_ci_if_error: false

    - name: Publish JaCoCo report as artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: jacoco-report
        path: back/target/site/jacoco/

  frontend-tests:
    runs-on: ubuntu-latest
    name: Frontend Tests & Coverage

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '16'
        cache: 'npm'
        cache-dependency-path: front/package-lock.json

    - name: Install dependencies
      run: |
        cd front
        npm ci

    - name: Run tests with coverage
      run: |
        cd front
        npm run test -- --watch=false --code-coverage --browsers=ChromeHeadless

    - name: Upload Karma coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: ./front/coverage/lcov.info
        flags: frontend
        name: frontend-coverage
        fail_ci_if_error: false

    - name: Publish Karma coverage report as artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: karma-coverage-report
        path: front/coverage/

  coverage-report:
    runs-on: ubuntu-latest
    name: Coverage Report Summary
    needs: [backend-tests, frontend-tests]
    if: always()

    steps:
    - name: Download backend coverage
      uses: actions/download-artifact@v4
      with:
        name: jacoco-report
        path: backend-coverage

    - name: Download frontend coverage
      uses: actions/download-artifact@v4
      with:
        name: karma-coverage-report
        path: frontend-coverage

    - name: Display coverage reports
      run: |
        echo "=== Backend Coverage Report ==="
        if [ -f backend-coverage/index.html ]; then
          echo "JaCoCo report generated successfully"
          echo "Report available at: backend-coverage/index.html"
        fi
        echo ""
        echo "=== Frontend Coverage Report ==="
        if [ -f frontend-coverage/lcov.info ]; then
          echo "Karma coverage report generated successfully"
          echo "Report available at: frontend-coverage/index.html"
        fi








