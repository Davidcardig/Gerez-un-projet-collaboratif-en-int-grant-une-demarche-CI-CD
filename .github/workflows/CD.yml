name: CD - Build, Test, Quality & Publish

on:
  push:
    branches: [ main ]

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'back/**'
            frontend:
              - 'front/**'

  backend:
    name: Backend - Build, Test & Sonar
    runs-on: ubuntu-latest
    needs: [ changes ]
    if: needs.changes.outputs.backend == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build, test & coverage
        run: |
          cd back
          mvn -B clean verify

      - name: SonarCloud Analysis
        run: |
          cd back
          mvn -B sonar:sonar \
            -Dsonar.projectKey=Davidcardig_Gerez-un-projet-collaboratif-en-int-grant-une-demarche-CI-CD \
            -Dsonar.organization=davidcardig \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.sources=src/main/java \
            -Dsonar.java.binaries=target/classes \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.junit.reportPaths=target/surefire-reports

  frontend:
    name: Frontend - Build, Test & Sonar
    runs-on: ubuntu-latest
    needs: [ changes ]
    if: needs.changes.outputs.frontend == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: front/package-lock.json

      - name: Install dependencies
        run: |
          cd front
          npm ci

      - name: Run tests with coverage
        run: |
          cd front
          npm run test -- --watch=false --code-coverage --browsers=ChromeHeadless

      - name: SonarCloud Analysis
        run: |
          docker run --rm \
            -e SONAR_HOST_URL=${{ secrets.SONAR_HOST_URL }} \
            -e SONAR_TOKEN=${{ secrets.SONAR_TOKEN }} \
            -e SONAR_SCANNER_OPTS="-Dsonar.javascript.lcov.reportPaths=coverage/lcov.info" \
            -v "${{ github.workspace }}/front":/usr/src \
            -w /usr/src \
            sonarsource/sonar-scanner-cli

  docker:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [ changes, backend, frontend ]
    # Ne publie que si les tests ont réussi (ou ont été ignorés car non concernés)

    if: >
      always() &&
      (needs.backend.result == 'success' || needs.backend.result == 'skipped') &&
      (needs.frontend.result == 'success' || needs.frontend.result == 'skipped') &&
      (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Update Backend Dockerfile
        if: needs.changes.outputs.backend == 'true'
        run: |
          sed -i 's|FROM openjdk:11-jdk-slim|FROM eclipse-temurin:11-jre-jammy|g' back/Dockerfile

      - name: Build & Push Backend
        if: needs.changes.outputs.backend == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./back
          push: true
          tags: davidcrdg/bobapp-back:latest

      - name: Build & Push Frontend
        if: needs.changes.outputs.frontend == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./front
          push: true
          tags: davidcrdg/bobapp-front:latest