name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    name: Backend Tests & Coverage

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      - name: Build and test backend with Maven
        run: |
          cd back
          mvn clean install -DskipTests=false

      - name: Generate JaCoCo coverage reports
        run: |
          cd back
          mvn jacoco:report

      - name: Upload JaCoCo coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./back/target/site/jacoco/jacoco.xml
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false

      - name: Publish JaCoCo report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: back/target/site/jacoco/

  frontend-tests:
    runs-on: ubuntu-latest
    name: Frontend Tests & Coverage

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16'
          cache: 'npm'
          cache-dependency-path: front/package-lock.json

      - name: Install dependencies
        run: |
          cd front
          npm ci

      - name: Run tests with coverage
        run: |
          cd front
          npm run test -- --watch=false --code-coverage --browsers=ChromeHeadless

      - name: Upload Karma coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./front/coverage/lcov.info
          flags: frontend
          name: frontend-coverage
          fail_ci_if_error: false

      - name: Publish Karma coverage report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: karma-coverage-report
          path: front/coverage/

  coverage-report:
    runs-on: ubuntu-latest
    name: Coverage Report Summary
    needs: [ backend-tests, frontend-tests ]
    if: always()

    steps:
      - name: Download backend coverage
        uses: actions/download-artifact@v4
        with:
          name: jacoco-report
          path: backend-coverage

      - name: Download frontend coverage
        uses: actions/download-artifact@v4
        with:
          name: karma-coverage-report
          path: frontend-coverage

      - name: Display coverage reports
        run: |
          echo "=== Backend Coverage Report ==="
          if [ -f backend-coverage/index.html ]; then
            echo "JaCoCo report generated successfully"
          fi
          echo "=== Frontend Coverage Report ==="
          if [ -f frontend-coverage/lcov.info ]; then
            echo "Karma coverage report generated successfully"
          fi

  sonar-backend:
    name: SonarCloud Analysis - Backend
    runs-on: ubuntu-latest
    needs: [ backend-tests ]
    if: github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build, test and generate coverage
        run: |
          cd back
          mvn clean verify

      - name: SonarCloud Analysis
        run: |
          cd back
          mvn sonar:sonar \
            -Dsonar.projectKey=Davidcardig_Gerez-un-projet-collaboratif-en-int-grant-une-demarche-CI-CD \
            -Dsonar.organization=davidcardig \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.sources=src/main/java \
            -Dsonar.java.binaries=target/classes \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.junit.reportPaths=target/surefire-reports

  sonar-frontend:
    name: SonarCloud Analysis - Frontend
    runs-on: ubuntu-latest
    needs: [ frontend-tests ]
    if: github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          cd front
          npm ci

      - name: Run tests with coverage
        run: |
          cd front
          npm run test -- --watch=false --code-coverage --browsers=ChromeHeadless

      - name: SonarCloud Analysis
        run: |
          docker run --rm \
            -e SONAR_HOST_URL=${{ secrets.SONAR_HOST_URL }} \
            -e SONAR_TOKEN=${{ secrets.SONAR_TOKEN }} \
            -e SONAR_SCANNER_OPTS="-Dsonar.javascript.lcov.reportPaths=coverage/lcov.info" \
            -v "${{ github.workspace }}/front":/usr/src \
            -w /usr/src \
            sonarsource/sonar-scanner-cli

  docker:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [ sonar-backend, sonar-frontend ]
    if: github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Update Backend Dockerfile
        run: |
          sed -i 's|FROM openjdk:11-jdk-slim|FROM eclipse-temurin:11-jre-jammy|g' back/Dockerfile

      - name: Build & Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./back
          push: true
          tags: davidcrdg/bobapp-back:latest

      - name: Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./front
          push: true
          tags: davidcrdg/bobapp-front:latest