name: Sonar Quality Gate (simplified)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  sonar:
    name: SonarQube Analysis (backend + frontend)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '16'

    - name: Backend - build, test, jacoco and Sonar
      run: |
        set -e
        cd back
        mvn clean test
        mvn jacoco:report
        # build sonar command and include project key only if provided
        CMD="mvn sonar:sonar -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} -Dsonar.login=${{ secrets.SONAR_TOKEN }} -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml -Dsonar.qualitygate.wait=true"
        if [ -n "${{ secrets.SONAR_PROJECT_KEY_BACKEND }}" ]; then
          CMD="$CMD -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY_BACKEND }}"
        fi
        echo "$CMD"
        eval $CMD

    - name: Frontend - tests and Sonar
      run: |
        set -e
        cd front
        npm ci
        npm run test -- --watch=false --code-coverage --browsers=ChromeHeadless
        # prepare sonar-scanner command (use Docker image)
        CMD="docker run --rm -e SONAR_HOST_URL=${{ secrets.SONAR_HOST_URL }} -e SONAR_LOGIN=${{ secrets.SONAR_TOKEN }} -v \"${{ github.workspace }}/front\":/usr/src -w /usr/src sonarsource/sonar-scanner-cli -Dsonar.login=\$SONAR_LOGIN -Dsonar.host.url=\$SONAR_HOST_URL -Dsonar.sources=src -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info -Dsonar.qualitygate.wait=true"
        if [ -n "${{ secrets.SONAR_PROJECT_KEY_FRONTEND }}" ]; then
          CMD="$CMD -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY_FRONTEND }}"
        fi
        echo "$CMD"
        eval $CMD




